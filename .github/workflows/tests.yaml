name: Tests
'on':
  push:
    branches:
    - hist/**
  workflow_dispatch:
    inputs:
      label:
        description: Label of the run
        default: ''
permissions:
  contents: write
jobs:
  tests:
    name: ${{ matrix.name || matrix.python }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - python: '3.14'
        - python: '3.11'
        - name: Minimum Versions
          python: '3.14'
          tox: tests-min
        - name: Development Versions
          python: '3.10'
          tox: tests-dev
    steps:
    - name: sensor probe
      uses: slashben/bstab-probe/probe@a6bd9ce3808926be68f077ec121bd8a762922b42
      with:
        token: ${{ github.token }}
        label: ${{ inputs.label }}
        matrix: ${{ toJSON(matrix) }}
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
      with:
        enable-cache: true
        prune-cache: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: ${{ matrix.python }}
    - run: uv run --locked tox run
      env:
        TOX_ENV: ${{ matrix.tox || format('py{0}', matrix.python) }}
  typing:
    runs-on: ubuntu-22.04
    steps:
    - name: sensor probe
      uses: slashben/bstab-probe/probe@a6bd9ce3808926be68f077ec121bd8a762922b42
      with:
        token: ${{ github.token }}
        label: ${{ inputs.label }}
        matrix: ${{ toJSON(matrix) }}
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098
      with:
        enable-cache: true
        prune-cache: false
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version-file: pyproject.toml
    - name: cache mypy
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
      with:
        path: ./.mypy_cache
        key: mypy|${{ hashFiles('pyproject.toml') }}
    - run: uv run --locked tox run -e typing
