name: Tests
'on':
  push:
    branches:
    - hist/**
  workflow_dispatch:
    inputs:
      label:
        description: Label of the run
        default: ''
permissions:
  contents: write
jobs:
  tests:
    name: ${{ matrix.name || matrix.python }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - python: '3.14'
        - python: '3.11'
        - name: Minimum Versions
          python: '3.14'
          tox: tests-min
        - name: Development Versions
          python: '3.11'
          tox: tests-dev
    steps:
    - name: sensor probe
      uses: slashben/bstab-probe/probe@a6bd9ce3808926be68f077ec121bd8a762922b42
      with:
        token: ${{ github.token }}
        label: ${{ inputs.label }}
        matrix: ${{ toJSON(matrix) }}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        enable-cache: true
        prune-cache: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.python }}
        allow-prereleases: true
    - run: uv run --locked --no-default-groups --group dev tox run
      env:
        TOX_ENV: ${{ matrix.tox || format('py{0}', matrix.python) }}
  typing:
    runs-on: ubuntu-22.04
    steps:
    - name: sensor probe
      uses: slashben/bstab-probe/probe@a6bd9ce3808926be68f077ec121bd8a762922b42
      with:
        token: ${{ github.token }}
        label: ${{ inputs.label }}
        matrix: ${{ toJSON(matrix) }}
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        enable-cache: true
        prune-cache: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version-file: pyproject.toml
    - name: cache mypy
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ./.mypy_cache
        key: mypy|${{ hashFiles('pyproject.toml') }}
    - run: uv run --locked --no-default-groups --group dev tox run -e typing
# stability test copy
